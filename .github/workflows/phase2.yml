name: Phase 2 Verification

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check apps/admin/src/server.js
      - run: node --check apps/public/src/server.js
      - run: node --check apps/admin/web/app.js
      - run: node --check apps/public/web/app.js
      - run: node --check packages/core/src/config.js
      - run: node --check packages/core/src/audit.js
      - run: node --check packages/core/src/activation-store.js
      - run: node --check packages/core/src/public-config-store.js
      - run: node --check scripts/audit-integrity-smoke.mjs
      - run: node scripts/audit-integrity-smoke.mjs
      - run: node scripts/smoke.mjs
      - run: node scripts/security-smoke.mjs
