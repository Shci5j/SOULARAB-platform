name: Publish Suolarab Money

on:
  push:
    branches:
      - main
      - feat/soularab-money-foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          name: soularab-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/public/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: soularab-pages-${{ github.run_id }}-${{ github.run_attempt }}
